# Forge Mods.toml 配置文件
modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "mc-mod"
version = "${mod_version}"
displayName = "AK-47 Mod"
authors = "AK-47 Author"
description = '''Adds AK-47 assault rifle with automatic fire and durability-based ammo'''

[[dependencies.mc-mod]]
modId = "forge"
mandatory = true
versionRange = "[47,48)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mc-mod]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.21)"
ordering = "NONE"
side = "BOTH"
